version: '3.8'

services:
  # ─────────────────────────────────────────────────
  # POSTGRES (Single DB for Monolith)
  # ─────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: cineflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cineflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────
  # REDIS (Cache, Seat Locking, BullMQ)
  # ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cineflow-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
