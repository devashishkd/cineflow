version: '3.8'

services:
  # ─────────────────────────────────────────────────
  # DATABASE (MongoDB)
  # ─────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: cineflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────
  # REDIS (Cache, Seat Locking, BullMQ)
  # ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cineflow-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongodb-data:
